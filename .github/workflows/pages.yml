name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check exclusion rules
        run: python3 scripts/check_exclusions.py
      - name: Check run rules
        run: python3 scripts/check_runs.py
      - name: Set up the HumanEval grading sandbox
        run: python3 data/humaneval/setup_eval.py
      - name: Check graders and re-grade runs
        run: python3 scripts/check_evals.py --skip-missing-setup
      - name: Check local-root build
        run: |
          python3 scripts/build_site.py
          python3 scripts/check_site.py
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and check Pages website
        env:
          BENCHOPEDIA_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 scripts/build_site.py
          python3 scripts/check_site.py
      - name: Check browser logic
        run: node scripts/check_ui.cjs
      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
